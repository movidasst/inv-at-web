name: Publicar vista previa MAC
on:
  push:
    paths:
      - '.github/workflows/mac-social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Crear imagen social con fuente original
        shell: bash
        run: |
          mkdir -p assets
          python - <<'PY'
            import io, os, urllib.request, subprocess
            from PIL import Image, ImageDraw, ImageFont, ImageFilter
            from urllib.parse import quote
            
            asset='659b37f9-30b2-4ec1-ad69-ed15b1f3ac5a'
            base='https://media.canva.com/v2/image-resize/format:JPG/height:630/quality:90/uri:ifs%3A%2F%2FM%2F'+asset+'/watermark:F/width:1200'
            thumb="https://media.canva.com/v2/image-resize/format:JPG/height:105/quality:75/uri:ifs%3A%2F%2FM%2F659b37f9-30b2-4ec1-ad69-ed15b1f3ac5a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEfwKs-WW_7rvCnUvXLACqRbyJSlyOjBka3JdoXsjfdo&exp=1793472351&osig=AAAAAAAAAAAAAAAAAAAAAHFqeIUL15o1R3pzweetTm_7c6x8Q7Q66sU2tlylr9i-&signer=media-rpc&token=AAIAAU0AJDY1OWIzN2Y5LTMwYjItNGVjMS1hZDY5LWVkMTViMWYzYWM1YQAAAAABoZNISxh0jjQ0S-OZfFSBeZnCsIffEbdYv3WNr5_cy2xreoQJKg&x-canva-quality=thumbnail"
            urls=[base, base+'?token='+thumb.split('token=')[1].split('&')[0],thumb]
            out=None
            for i,url in enumerate(urls):
             try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as res:
               data=res.read()
              im=Image.open(io.BytesIO(data)).convert('RGB')
              print('Source',i,im.size,'bytes',len(data))
              if im.width>=1100 and im.height>=550:
               out=im.resize((1200,630),Image.Resampling.LANCZOS)
               break
              if out is None:
               out=im
             except Exception as e:
              print('Unavailable source',i,str(e)[:250])
            
            if out is None:
             raise SystemExit('Could not download generated social image')
            
            if out.size!=(1200,630):
             # Avoid blurry text in small source: retain illustration subtly and redraw copy sharply
             canvas=out.resize((1200,630),Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(1.2))
             dr=ImageDraw.Draw(canvas,'RGBA')
             dr.rectangle((0,0,720,630),fill=(0,31,75,245))
             dr.rectangle((0,499,1200,630),fill=(0,26,59,210))
             dr.line([(45,360),(204,360)],fill='#FFB600',width=8)
             def font(size,bold=False):
              return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-'+('Bold' if bold else '')+'.ttf',size) if not bold else ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',size)
             def label(x,y,s,size,color='#FFFFFF',bold=False):
              dr.text((x,y),s,font=font(size,bold),fill=color)
             label(55,145,'MAC',154,bold=True)
             label(55,388,'Método del Árbol de Causas',37,bold=True)
             label(55,446,'Investigación de Accidentes de Trabajo',24)
             label(57,530,'Academia Movida de SST',24,bold=True)
             label(57,567,'De la Reacción a la Prevención',17)
             label(831,556,'mac.movidasst.com',23,bold=True)
             out=canvas
            out.save('assets/mac-social-preview-v2.jpg',format='JPEG',quality=91,subsampling=0,optimize=True)
            print('Saved',os.path.getsize('assets/mac-social-preview-v2.jpg'),'bytes',Image.open('assets/mac-social-preview-v2.jpg').size)
            
          PY
      - name: Guardar imagen en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mac-social-preview-v2.jpg
          git commit -m "Publicar imagen social mejorada de MAC" || exit 0
          git push
