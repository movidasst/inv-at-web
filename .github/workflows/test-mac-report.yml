name: Comprobar integridad y reportes MAC
on:
  push:
    paths:
      - '.github/workflows/test-mac-report.yml'
      - 'v2.js'
      - 'auth.js'
      - 'v2.css'
      - 'index.html'
      - 'v2.html'
      - 'aula/**'
      - 'tests/**'
      - 'server/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Instalar PostgreSQL de pruebas desde lockfile
        run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Verificar runtime Edge sin secretos
        run: |
          deno check --node-modules-dir=none --frozen --lock=supabase/deno.lock supabase/functions/mac-aula-evaluate/index.ts
          deno test --node-modules-dir=none tests/edge-runtime.test.ts
      - name: Regresiones de integridad y cifrado
        run: node --test tests/*.test.cjs
      - name: Instalar herramientas de navegador y PDF
        run: |
          npm install --no-save playwright@1.62.1 pdfjs-dist@5.6.205 @napi-rs/canvas@0.1.100
          npx playwright install --with-deps chromium
      - name: Verificar recorrido académico de desarrollo
        run: node tests/aula-browser.cjs
      - name: Verificar sesión, Excel y PDF en navegador
        run: node tests/browser.cjs
      - name: Comprobar límites de texto PDF y renderizar evidencia
        run: node tests/pdf.cjs
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAC-regresiones-reportes
          path: test-artifacts/
          retention-days: 7
